# Despliegue de Ollama para el Nodo C (Laptop Lenovo Móvil)
# Este servicio corre en segundo plano y expone el puerto 11434 exclusivamente en 127.0.0.1
# para permitir que el asistente de voz acceda al LLM tanto en casa como fuera de ella.
#
# Características de esta configuración:
# 1. GPU Passthrough: Utiliza la GPU NVIDIA GeForce GTX 1060 (6 GB VRAM) mediante el driver nvidia.
# 2. Persistencia: Mapea la carpeta del host /home/antsanch/.ollama para no tener que redescargar modelos.
# 3. Reinicio automático: unless-stopped garantiza que esté siempre disponible al iniciar sesión.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: voice_assistant_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - /home/antsanch/.ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1  # Mantiene el modelo en VRAM indefinidamente para cero latencia
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
